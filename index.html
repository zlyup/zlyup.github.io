<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>zlyup博客</title>
    <style>
        /* ========== 基础重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            background: #fafafa;
            overscroll-behavior: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
        }
        
        .scroll-container {
            position: relative;
            width: 100%;
            height: 200vh;
        }
        
        /* ========== 上层：GitHub 装饰层 ========== */
        .github-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 20;
            background: #ffffff;
            overflow: hidden;
            padding: 24px;
            color: #24292e;
            filter: blur(0px) brightness(1) contrast(1) saturate(1);
            opacity: 1;
            will-change: filter, opacity, transform;
            transform: translateZ(0);
            transition: filter 0.02s;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .github-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .github-header {
            display: flex;
            align-items: center;
            gap: clamp(16px, 4vw, 32px);
            padding: clamp(20px, 4vw, 40px) 0;
            border-bottom: 1px solid #edf0f5;
            margin-bottom: clamp(16px, 3vw, 32px);
        }
        
        .github-avatar {
            width: clamp(70px, 15vw, 120px);
            height: clamp(70px, 15vw, 120px);
            border-radius: 50%;
            background: linear-gradient(145deg, #6e5494, #4078c0, #2d5b9a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: clamp(28px, 6vw, 52px);
            font-weight: 300;
            box-shadow: 0 15px 30px -12px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            aspect-ratio: 1/1;
        }
        
        .github-avatar::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: rotate(45deg);
            animation: shimmer 6s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            20% { transform: translateX(100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        
        .github-user-info {
            min-width: 0;
            flex: 1;
        }
        
        .github-user-info h1 {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 500;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .github-user-info p {
            color: #586069;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 300;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .github-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 2vw, 20px);
            margin: clamp(20px, 4vw, 40px) 0;
            padding: clamp(16px, 3vw, 28px);
            background: linear-gradient(145deg, #f8fafd, #f1f4f9);
            border-radius: clamp(16px, 4vw, 24px);
            border: 1px solid rgba(0,0,0,0.02);
        }
        
        .stat-item {
            text-align: center;
            position: relative;
        }
        
        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 20%;
            height: 60%;
            width: 1px;
            background: #d0d7de;
        }
        
        .stat-number {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 400;
            color: #0366d6;
            margin-bottom: 4px;
            font-feature-settings: "tnum";
            white-space: nowrap;
        }
        
        .stat-label {
            color: #586069;
            font-size: clamp(12px, 2.5vw, 14px);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }
        
        /* ========== 高级过渡层 ========== */
        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 22;
            mix-blend-mode: soft-light;
            opacity: 0;
            background: radial-gradient(circle at 50% 30%, rgba(255,245,220,0.4) 0%, transparent 70%);
            will-change: opacity;
        }
        
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 23;
            opacity: 0;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjc0IiBudW1PY3RhdmVzPSIzIiAvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNmKSIgb3BhY2l0eT0iMC4wNSIgLz48L3N2Zz4=');
            background-repeat: repeat;
            background-size: 180px 180px;
            mix-blend-mode: multiply;
            will-change: opacity;
            pointer-events: none;
        }
        
        .chromatic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 21;
            opacity: 0;
            mix-blend-mode: overlay;
            will-change: opacity;
        }
        
        .chromatic-overlay::before,
        .chromatic-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: screen;
            pointer-events: none;
        }
        
        .chromatic-overlay::before {
            background: rgba(255, 80, 80, 0.12);
            transform: translateX(1.5px);
        }
        
        .chromatic-overlay::after {
            background: rgba(80, 160, 255, 0.12);
            transform: translateX(-1.5px);
        }
        
        #smoke-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 30;
            display: block;
            opacity: 0;
            will-change: opacity;
        }
        
        /* ========== 下层：博客主页面 ========== */
        .blog-layer {
            position: absolute;
            top: 100vh;
            left: 0;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            z-index: 10;
            padding: clamp(30px, 6vw, 60px) clamp(16px, 4vw, 24px) clamp(40px, 8vw, 80px);
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }
        
        .blog-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .blog-header {
            text-align: center;
            margin-bottom: clamp(30px, 6vw, 60px);
        }
        
        .blog-header h1 {
            font-size: clamp(2.2rem, 8vw, 4.5rem);
            font-weight: 300;
            letter-spacing: clamp(2px, 1vw, 4px);
            color: #1a1a1a;
            margin-bottom: 16px;
            word-break: break-word;
        }
        
        .blog-header .sub {
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            letter-spacing: clamp(2px, 0.5vw, 3px);
            color: #666;
            font-family: 'Courier New', monospace;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            display: inline-block;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 4vw, 24px);
            background: #fafafa;
        }
        
        .blog-post {
            display: flex;
            flex-direction: row;
            gap: clamp(16px, 3vw, 30px);
            padding: clamp(20px, 4vw, 32px) 0;
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        @media (max-width: 600px) {
            .blog-post {
                flex-direction: column;
                gap: 8px;
            }
            .post-date {
                min-width: auto;
                font-size: 0.85rem;
                color: #999;
            }
        }
        
        .blog-post:hover {
            transform: translateX(8px);
            border-bottom-color: #0366d6;
            background: linear-gradient(to right, rgba(3,102,214,0.02), transparent);
        }
        
        .blog-post:active {
            transform: translateX(4px);
            opacity: 0.9;
        }
        
        .post-date {
            min-width: 100px;
            font-family: 'Courier New', monospace;
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        
        .post-content {
            flex: 1;
        }
        
        .post-content h2 {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 350;
            margin-bottom: clamp(8px, 2vw, 12px);
            color: #222;
            line-height: 1.3;
            transition: color 0.2s;
        }
        
        .blog-post:hover .post-content h2 {
            color: #0366d6;
        }
        
        .post-content p {
            color: #555;
            line-height: 1.7;
            margin-bottom: 16px;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
        }
        
        .post-meta {
            display: flex;
            gap: 20px;
            color: #999;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            flex-wrap: wrap;
        }
        
        .about-section {
            margin: clamp(30px, 6vw, 60px) 0 clamp(20px, 4vw, 40px);
            padding: clamp(24px, 5vw, 40px);
            background: #f8f8f8;
            border-radius: clamp(16px, 4vw, 24px);
        }
        
        .about-section h3 {
            font-weight: 350;
            font-size: clamp(1.5rem, 4vw, 1.8rem);
            margin-bottom: 20px;
            color: #222;
        }
        
        .about-section p {
            color: #555;
            line-height: 1.8;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            margin-bottom: 24px;
        }
        
        .social-links {
            display: flex;
            gap: clamp(16px, 4vw, 30px);
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .social-links span {
            font-family: 'Courier New', monospace;
            color: #666;
            border-bottom: 1px dotted #ccc;
            cursor: default;
            font-size: clamp(0.85rem, 2vw, 1rem);
            white-space: nowrap;
        }
        
        .loading-tip {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,30,0.85);
            backdrop-filter: blur(12px);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 200;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <!-- 上层：GitHub 装饰层 -->
    <div class="github-layer" id="githubLayer">
        <div class="github-container" id="githubContainer">
            <div style="text-align: center; color: #666;">加载 GitHub 数据中...</div>
        </div>
    </div>
    
    <!-- 高级过渡层 -->
    <div class="glow-overlay" id="glowOverlay"></div>
    <div class="film-grain" id="filmGrain"></div>
    <div class="chromatic-overlay" id="chromaticOverlay"></div>
    <canvas id="smoke-canvas"></canvas>
    
    <!-- 下层：博客主页面 -->
    <div class="blog-layer" id="blogLayer">
        <div class="blog-container" id="blogContainer">
            <div class="blog-header">
                <h1>zlyup博客站</h1>
                <div class="sub">GITHUB · REPOS · CODE</div>
            </div>
            
            <div id="blogPostsContainer">
                <div style="text-align: center; padding: 40px; color: #999;">加载仓库数据中...</div>
            </div>
            
            <div class="about-section">
                <h3>关于我 · zlyup</h3>
                <p>文章都是从我的 GitHub 仓库自动生成的，点击每个仓库可以打开对应的项目页面。</p>
                <div class="social-links">
                    <span>GitHub: zlyup</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="loading-tip" id="loadingTip">加载 GitHub 数据中...</div>
    
    <script>
        (function() {
            // ==================== 获取元素 ====================
            const githubLayer = document.getElementById('githubLayer');
            const githubContainer = document.getElementById('githubContainer');
            const blogPostsContainer = document.getElementById('blogPostsContainer');
            const glowOverlay = document.getElementById('glowOverlay');
            const filmGrain = document.getElementById('filmGrain');
            const chromaticOverlay = document.getElementById('chromaticOverlay');
            const smokeCanvas = document.getElementById('smoke-canvas');
            const loadingTip = document.getElementById('loadingTip');
            
            // ==================== 初始化 Canvas ====================
            const ctx = smokeCanvas.getContext('2d', { alpha: true, desynchronized: true });
            
            function resizeCanvas() {
                smokeCanvas.width = window.innerWidth;
                smokeCanvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // ==================== 获取 GitHub 数据 ====================
            async function fetchGitHubData() {
                try {
                    loadingTip.style.opacity = '1';
                    loadingTip.textContent = '获取 GitHub 数据中...';
                    
                    const userRes = await fetch('https://api.github.com/users/zlyup');
                    if (!userRes.ok) throw new Error('用户不存在');
                    const user = await userRes.json();
                    
                    const reposRes = await fetch('https://api.github.com/users/zlyup/repos?sort=updated&per_page=30');
                    const repos = await reposRes.json();
                    
                    renderGitHubProfile(user);
                    renderBlogPosts(repos);
                    
                    loadingTip.textContent = '✅ 数据加载成功';
                    setTimeout(() => loadingTip.style.opacity = '0', 1500);
                    
                } catch (error) {
                    console.error('获取 GitHub 数据失败', error);
                    loadingTip.textContent = '使用本地数据';
                    
                    renderLocalProfile();
                    renderLocalBlogPosts();
                    
                    setTimeout(() => loadingTip.style.opacity = '0', 2000);
                }
            }
            
            function renderGitHubProfile(user) {
                const avatarLetter = user.name ? user.name.charAt(0) : 'Z';
                githubContainer.innerHTML = `
                    <div class="github-header">
                        <div class="github-avatar">${avatarLetter}</div>
                        <div class="github-user-info">
                            <h1>${user.name || 'zlyup'}</h1>
                            <p>${user.bio || '开发者 · 代码诗人'}</p>
                        </div>
                    </div>
                    <div class="github-stats">
                        <div class="stat-item"><div class="stat-number">${user.public_repos || 0}</div><div class="stat-label">仓库</div></div>
                        <div class="stat-item"><div class="stat-number">${user.followers || 0}</div><div class="stat-label">粉丝</div></div>
                        <div class="stat-item"><div class="stat-number">${user.following || 0}</div><div class="stat-label">关注</div></div>
                    </div>
                `;
            }
            
            function renderBlogPosts(repos) {
                if (!repos?.length) {
                    blogPostsContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">没有找到仓库</div>';
                    return;
                }
                
                const postsHtml = repos.slice(0, 10).map(repo => {
                    const updatedAt = new Date(repo.updated_at).toISOString().split('T')[0].replace(/-/g, '.');
                    const description = repo.description || '一个有趣的仓库，包含一些代码和想法';
                    const language = repo.language || '多种语言';
                    
                    // 构建项目URL (GitHub Pages 格式)
                    const projectUrl = `https://zlyup.github.io/${repo.name}/`;
                    
                    return `
                        <div class="blog-post" onclick="window.open('${projectUrl}', '_blank')">
                            <div class="post-date">${updatedAt}</div>
                            <div class="post-content">
                                <h2>${repo.name}</h2>
                                <p>${description}</p>
                                <div class="post-meta">
                                    <span>⭐ ${repo.stargazers_count}</span>
                                    <span>⑂ ${repo.forks_count}</span>
                                    <span>${language}</span>
                                    <span>🔗 点击打开</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                blogPostsContainer.innerHTML = postsHtml;
            }
            
            function renderLocalProfile() {
                githubContainer.innerHTML = `
                    <div class="github-header">
                        <div class="github-avatar">Z</div>
                        <div class="github-user-info">
                            <h1>zlyup</h1>
                            <p>前端开发 · 电影质感追求者</p>
                        </div>
                    </div>
                    <div class="github-stats">
                        <div class="stat-item"><div class="stat-number">24</div><div class="stat-label">仓库</div></div>
                        <div class="stat-item"><div class="stat-number">128</div><div class="stat-label">粉丝</div></div>
                        <div class="stat-item"><div class="stat-number">86</div><div class="stat-label">关注</div></div>
                    </div>
                `;
            }
            
            function renderLocalBlogPosts() {
                blogPostsContainer.innerHTML = `
                    <div class="blog-post" onclick="window.open('https://zlyup.github.io/liuren-divination-system/', '_blank')">
                        <div class="post-date">2026.02.19</div>
                        <div class="post-content">
                            <h2>liuren-divination-system</h2>
                            <p>六壬占卜系统 · 一个有趣的占卜项目</p>
                            <div class="post-meta"><span>⭐ 42</span><span>⑂ 12</span><span>JavaScript</span><span>🔗 点击打开</span></div>
                        </div>
                    </div>
                    <div class="blog-post" onclick="window.open('https://zlyup.github.io/cinematic-transition/', '_blank')">
                        <div class="post-date">2026.02.15</div>
                        <div class="post-content">
                            <h2>cinematic-transition</h2>
                            <p>电影级过渡效果，包含光晕、颗粒、色散和烟雾粒子四层效果。</p>
                            <div class="post-meta"><span>⭐ 38</span><span>⑂ 8</span><span>TypeScript</span><span>🔗 点击打开</span></div>
                        </div>
                    </div>
                    <div class="blog-post" onclick="window.open('https://zlyup.github.io/smoke-particles/', '_blank')">
                        <div class="post-date">2026.02.10</div>
                        <div class="post-content">
                            <h2>smoke-particles</h2>
                            <p>40个烟雾粒子，每个都有独立的速度、大小、透明度。</p>
                            <div class="post-meta"><span>⭐ 27</span><span>⑂ 5</span><span>GLSL</span><span>🔗 点击打开</span></div>
                        </div>
                    </div>
                    <div class="blog-post" onclick="window.open('https://zlyup.github.io/chromatic-aberration/', '_blank')">
                        <div class="post-date">2026.02.05</div>
                        <div class="post-content">
                            <h2>chromatic-aberration</h2>
                            <p>RGB 色散效果，创造独特的视觉质感。</p>
                            <div class="post-meta"><span>⭐ 19</span><span>⑂ 3</span><span>CSS/JS</span><span>🔗 点击打开</span></div>
                        </div>
                    </div>
                `;
            }
            
            // ==================== 烟雾粒子系统 ====================
            class SmokeParticle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * smokeCanvas.width;
                    this.y = Math.random() * smokeCanvas.height;
                    this.vx = (Math.random() - 0.5) * 0.25;
                    this.vy = (Math.random() - 0.3) * 0.2;
                    this.size = 30 + Math.random() * 50;
                    this.opacity = 0.15 + Math.random() * 0.25;
                    this.speed = 0.2 + Math.random() * 0.3;
                }
                update(progress) {
                    this.x += this.vx * this.speed;
                    this.y += this.vy * this.speed - 0.01;
                    if (this.x < -100 || this.x > smokeCanvas.width + 100 || this.y < -100 || this.y > smokeCanvas.height + 100) this.reset();
                    return this.opacity * Math.sin(progress * Math.PI) * 1.2;
                }
            }
            
            const particles = Array.from({ length: 40 }, () => new SmokeParticle());
            
            function drawSmoke(progress) {
                if (progress <= 0.05 || progress >= 0.98) {
                    smokeCanvas.style.opacity = '0';
                    return;
                }
                
                const smokeIntensity = Math.sin(progress * Math.PI) * 0.7;
                smokeCanvas.style.opacity = smokeIntensity.toString();
                
                ctx.clearRect(0, 0, smokeCanvas.width, smokeCanvas.height);
                ctx.globalCompositeOperation = 'screen';
                
                particles.forEach(p => {
                    const opacity = p.update(progress) * smokeIntensity;
                    if (opacity <= 0.01) return;
                    
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, `rgba(245, 245, 255, ${opacity * 0.6})`);
                    gradient.addColorStop(0.4, `rgba(220, 220, 240, ${opacity * 0.3})`);
                    gradient.addColorStop(0.8, `rgba(200, 200, 220, ${opacity * 0.1})`);
                    gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                });
            }
            
            // ==================== 过渡效果 ====================
            let ticking = false;
            
            function updateTransition() {
                const progress = Math.min(Math.max(window.scrollY / window.innerHeight, 0), 1);
                const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                
                githubLayer.style.filter = `blur(${eased * 18}px) brightness(${1 - eased * 0.15}) contrast(${1 + eased * 0.1}) saturate(${1 - eased * 0.25})`;
                
                if (eased < 0.4) glowOverlay.style.opacity = (eased / 0.4) * 0.3;
                else if (eased < 0.7) glowOverlay.style.opacity = 0.3;
                else glowOverlay.style.opacity = 0.3 * (1 - (eased - 0.7) / 0.3);
                
                filmGrain.style.opacity = (eased > 0.2 && eased < 0.8) ? 0.15 * Math.sin((eased - 0.2) / 0.6 * Math.PI) : 0;
                chromaticOverlay.style.opacity = (eased > 0.3 && eased < 0.7) ? 0.25 * Math.sin((eased - 0.3) / 0.4 * Math.PI) : 0;
                
                drawSmoke(eased);
                githubLayer.style.opacity = eased > 0.8 ? 1 - (eased - 0.8) * 5 : 1;
            }
            
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        updateTransition();
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                updateTransition();
            });
            
            fetchGitHubData();
            updateTransition();
            
            function animationLoop() {
                const progress = window.scrollY / window.innerHeight;
                if (progress > 0.05 && progress < 0.95) drawSmoke(progress);
                requestAnimationFrame(animationLoop);
            }
            animationLoop();
            
            document.addEventListener('dblclick', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            
        })();
    </script>
</body>
</html>
